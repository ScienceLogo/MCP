name: Publish MCP

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  publish-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release variables
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sciencelogo-mcp:${VERSION}" >> "$GITHUB_ENV"

      - name: Verify release version alignment
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          init_text = pathlib.Path("src/sciencelogo_mcp/__init__.py").read_text(encoding="utf-8")
          init_version = re.search(r'__version__ = "([^"]+)"', init_text).group(1)
          dockerfile = pathlib.Path("Dockerfile").read_text(encoding="utf-8")
          release = re.search(r"^ARG SCIENCELOGO_RELEASE=v(\S+)$", dockerfile, re.M).group(1)
          if version != init_version:
              raise SystemExit(f"Version mismatch: tag={version}, __init__={init_version}")
          # The first two numbers of the server's version name the language version.
          if ".".join(version.split("-")[0].split(".")[:2]) != release:
              raise SystemExit(f"Version {version} does not match language release {release}")
          print("Release metadata aligned.")
          PY

      - name: Update server.json for this release
        run: |
          jq --arg version "$VERSION" --arg image "$IMAGE" \
            '.version = $version | .packages[0].identifier = $image' \
            server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json
